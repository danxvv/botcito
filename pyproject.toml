[project]
name = "discordbotcito"
version = "0.1.0"
description = "Discord music bot with autoplay and Opus streaming"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "discord.py[voice]>=2.7.1,<3.0.0",
    "yt-dlp>=2026.8.19",
    "ytmusicapi>=1.12.2,<2.0.0",
    "python-dotenv>=1.2.3,<2.0.0",
    "textual>=8.2.8",
]

[project.scripts]
audit = "audit:run_audit"
botcito = "main:main"

[tool.uv]
package = true

[build-system]
requires = ["setuptools>=84.0.0"]
build-backend = "setuptools.build_meta"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.setuptools.packages.find]
include = ["audit*", "commands*"]

[tool.setuptools]
py-modules = ["audio_cache", "autoplay", "main", "music_player", "ratings", "youtube"]

[tool.setuptools.package-data]
audit = ["styles.tcss"]
