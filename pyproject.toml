[project]
name = "discordbotcito"
version = "0.1.0"
description = "Discord music bot with autoplay and Opus streaming"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "discord.py[voice]>=2.6.0,<3.0.0",
    "yt-dlp>=2026.2.4",
    "ytmusicapi>=1.11.0,<2.0.0",
    "python-dotenv>=1.0.0,<2.0.0",
    "textual>=7.3.0",
]

[project.scripts]
audit = "audit:run_audit"
botcito = "main:main"

[tool.uv]
package = true

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["audit*", "commands*"]

[tool.setuptools]
py-modules = ["audio_cache", "autoplay", "main", "music_player", "ratings", "youtube"]

[tool.setuptools.package-data]
audit = ["styles.tcss"]
